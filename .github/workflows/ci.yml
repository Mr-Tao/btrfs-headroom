name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, vet, and test
        run: make check
      - name: Race tests
        run: make test-race

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install documentation and completion tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            fish groff scdoc shellcheck zsh
      - name: Generate and check documentation
        run: |
          make man
          make man-check
          test -s build/man/btrfs-headroom.1
      - name: Generate and check shell completions
        run: make completions-check
      - name: Check shell scripts
        run: make shellcheck
      - name: Verify systemd units
        run: |
          sudo install -Dm0755 build/bin/btrfs-headroom \
            /usr/bin/btrfs-headroom
          sudo install -Dm0755 \
            contrib/systemd/user/btrfs-headroom-notify \
            /usr/lib/btrfs-headroom/btrfs-headroom-notify
          make systemd-check

  arm64:
    name: ARM64 compile-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile Linux ARM64 binary
        run: |
          make arm64-check
          test -s build/arm64/btrfs-headroom
